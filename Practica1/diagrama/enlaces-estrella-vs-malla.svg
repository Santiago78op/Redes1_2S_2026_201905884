<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 410" width="760" height="410">
  <title>Enlaces necesarios: estrella frente a malla completa - QuetzalDev</title>
  <desc>Para 3, 4, 7, 8 y 10 hosts la estrella necesita n enlaces y la malla n(n-1)/2. En Capacitacion son 10 contra 45.</desc>
  <style>
  text{font-family:Consolas,"Courier New",monospace;fill:#14202C}
  .h{font-size:15px;font-weight:700;letter-spacing:.02em}
  .l{font-size:13px;fill:#4A5C6E} .s{font-size:11px;fill:#8497A8}
  .v{font-size:14px;font-weight:700} .c{font-size:11px;fill:#8497A8;letter-spacing:.12em}
  .a{fill:#0E8F7E} .b{fill:#1668B8} .o{fill:#9AA9B6} .f{fill:#C0392B}
  .ta{fill:#0E8F7E} .tb{fill:#1668B8} .to{fill:#9AA9B6} .tf{fill:#C0392B;font-weight:700}
  .tr{fill:#E4EAF0} .ax{stroke:#8497A8;stroke-width:1;fill:none}
  .gl{stroke:#C7D2DC;stroke-width:1;fill:none} .rl{stroke:#14202C;stroke-width:1.5;fill:none}
  .no{fill:#FFFFFF;stroke:#0E8F7E;stroke-width:2.4} .nh{fill:#0E8F7E;stroke:#0E8F7E;stroke-width:2.4}
  .nf{fill:#FFFFFF;stroke:#C0392B;stroke-width:2.8} .nd{fill:#E4EAF0;stroke:#9AA9B6;stroke-width:2}
  .noff{fill:#FFFFFF;stroke:#9AA9B6;stroke-width:2}
  .lo{stroke:#0E8F7E;stroke-width:2;fill:none} .loff{stroke:#9AA9B6;stroke-width:1.6;fill:none}
  .lf{stroke:#C0392B;stroke-width:2.4;fill:none;stroke-dasharray:5 3}
  .ld{stroke:#9AA9B6;stroke-width:1.6;fill:none;stroke-dasharray:4 3}
</style>
  <rect x="0" y="0" width="760" height="410" fill="#FFFFFF"/>
  <text class="l" x="120" y="44" text-anchor="end">3 hosts</text>
  <text class="s" x="120" y="58" text-anchor="end">Data Center</text>
  <rect class="a" x="130" y="30" width="35.333333333333336" height="20" rx="3"/>
  <text class="v" x="175.33333333333334" y="45" text-anchor="start">3</text>
  <rect class="b" x="130" y="52" width="35.333333333333336" height="20" rx="3"/>
  <text class="v" x="175.33333333333334" y="67" text-anchor="start">3</text>
  <text class="l" x="120" y="102" text-anchor="end">4 hosts</text>
  <text class="s" x="120" y="116" text-anchor="end">Recepción · Legal · Dirección</text>
  <rect class="a" x="130" y="88" width="47.111111111111114" height="20" rx="3"/>
  <text class="v" x="187.11111111111111" y="103" text-anchor="start">4</text>
  <rect class="b" x="130" y="110" width="70.66666666666667" height="20" rx="3"/>
  <text class="v" x="210.66666666666669" y="125" text-anchor="start">6</text>
  <text class="l" x="120" y="160" text-anchor="end">7 hosts</text>
  <text class="s" x="120" y="174" text-anchor="end">Backend</text>
  <rect class="a" x="130" y="146" width="82.44444444444446" height="20" rx="3"/>
  <text class="v" x="222.44444444444446" y="161" text-anchor="start">7</text>
  <rect class="b" x="130" y="168" width="247.33333333333334" height="20" rx="3"/>
  <text class="v" x="387.33333333333337" y="183" text-anchor="start">21</text>
  <text class="l" x="120" y="218" text-anchor="end">8 hosts</text>
  <text class="s" x="120" y="232" text-anchor="end">RR. HH. · Diseño</text>
  <rect class="a" x="130" y="204" width="94.22222222222223" height="20" rx="3"/>
  <text class="v" x="234.22222222222223" y="219" text-anchor="start">8</text>
  <rect class="b" x="130" y="226" width="329.7777777777778" height="20" rx="3"/>
  <text class="v" x="469.7777777777778" y="241" text-anchor="start">28</text>
  <text class="l" x="120" y="276" text-anchor="end">10 hosts</text>
  <text class="s" x="120" y="290" text-anchor="end">Capacitación</text>
  <rect class="a" x="130" y="262" width="117.77777777777779" height="20" rx="3"/>
  <text class="v" x="257.77777777777777" y="277" text-anchor="start">10</text>
  <rect class="b" x="130" y="284" width="530" height="20" rx="3"/>
  <text class="v" x="670" y="299" text-anchor="start">45</text>
  <line class="ax" x1="130" y1="316" x2="660" y2="316"/>
  <line class="ax" x1="130" y1="316" x2="130" y2="322"/>
  <text class="s" x="130" y="336" text-anchor="middle">0</text>
  <line class="ax" x1="306.6666666666667" y1="316" x2="306.6666666666667" y2="322"/>
  <text class="s" x="306.6666666666667" y="336" text-anchor="middle">15</text>
  <line class="ax" x1="483.33333333333337" y1="316" x2="483.33333333333337" y2="322"/>
  <text class="s" x="483.33333333333337" y="336" text-anchor="middle">30</text>
  <line class="ax" x1="660" y1="316" x2="660" y2="322"/>
  <text class="s" x="660" y="336" text-anchor="middle">45 enlaces</text>
  <rect class="a" x="130" y="356" width="14" height="11" rx="2"/>
  <text class="s" x="152" y="366" text-anchor="start">Estrella — n enlaces</text>
  <rect class="b" x="330" y="356" width="14" height="11" rx="2"/>
  <text class="s" x="352" y="366" text-anchor="start">Malla completa — n(n−1)/2 enlaces</text>
  <text class="s" x="130" y="392" text-anchor="start">Sobre los 48 puntos del edificio la malla exigiría 1 128 enlaces frente a los 48 de la estrella.</text>
</svg>

  <rect class="tr" x="200" y="248" width="333.3333333333333" height="18" rx="3"/>
  <rect class="a" x="200" y="248" width="145.83333333333331" height="18" rx="3"/>
  <line x1="450" y1="245" x2="450" y2="269" stroke="#14202C" stroke-width="2"/>
  <text class="s" x="545" y="262" text-anchor="start">7 / 12 / 16</text>
  <text class="l" x="190" y="300" text-anchor="end">Data Center</text>
  <rect class="tr" x="200" y="286" width="333.3333333333333" height="18" rx="3"/>
  <rect class="a" x="200" y="286" width="62.5" height="18" rx="3"/>
  <line x1="450" y1="283" x2="450" y2="307" stroke="#14202C" stroke-width="2"/>
  <text class="s" x="545" y="300" text-anchor="start">3 / 12 / 16</text>
  <text class="l" x="190" y="338" text-anchor="end">MDF · troncales</text>
  <rect class="tr" x="200" y="324" width="500" height="18" rx="3"/>
  <rect class="b" x="200" y="324" width="166.66666666666666" height="18" rx="3"/>
  <line x1="450" y1="321" x2="450" y2="345" stroke="#14202C" stroke-width="2"/>
  <text class="s" x="712" y="338" text-anchor="start">8 / 12 / 24</text>
  <line class="ax" x1="200" y1="358" x2="700" y2="358"/>
  <line class="ax" x1="200" y1="358" x2="200" y2="364"/>
  <text class="s" x="200" y="378" text-anchor="middle">0</text>
  <line class="ax" x1="450" y1="358" x2="450" y2="364"/>
  <text class="s" x="450" y="378" text-anchor="middle">12 · marco</text>
  <line class="ax" x1="533.3333333333333" y1="358" x2="533.3333333333333" y2="364"/>
  <text class="s" x="533.3333333333333" y="378" text-anchor="middle">16</text>
  <line class="ax" x1="700" y1="358" x2="700" y2="364"/>
  <text class="s" x="700" y="378" text-anchor="middle">24 puertos</text>
  <text class="c" x="200" y="398" text-anchor="start">BARRA = PUERTOS POBLADOS · PISTA = PUERTOS DEL SWITCH · LÍNEA = CAPACIDAD DEL MARCO</text>
  <text class="s" x="200" y="420" text-anchor="start">La pista termina siempre a la derecha de la línea, y la barra nunca la alcanza: la regla se cumple</text>
  <text class="s" x="200" y="436" text-anchor="start">tanto si se compara contra los puertos poblados como contra la capacidad del marco.</text>
</svg>

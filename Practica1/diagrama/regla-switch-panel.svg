<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 450" width="760" height="450">
  <title>Verificacion de la regla switch >= patch panel - QuetzalDev</title>
  <desc>Para cada ubicacion se comparan puertos poblados, capacidad del marco de 12 posiciones y puertos del switch. En los nueve casos el switch iguala o supera ambos.</desc>
  <style>
  text{font-family:Consolas,"Courier New",monospace;fill:#14202C}
  .h{font-size:15px;font-weight:700;letter-spacing:.02em}
  .l{font-size:13px;fill:#4A5C6E} .s{font-size:11px;fill:#8497A8}
  .v{font-size:14px;font-weight:700} .c{font-size:11px;fill:#8497A8;letter-spacing:.12em}
  .a{fill:#0E8F7E} .b{fill:#1668B8} .o{fill:#9AA9B6} .f{fill:#C0392B}
  .ta{fill:#0E8F7E} .tb{fill:#1668B8} .to{fill:#9AA9B6} .tf{fill:#C0392B;font-weight:700}
  .tr{fill:#E4EAF0} .ax{stroke:#8497A8;stroke-width:1;fill:none}
  .gl{stroke:#C7D2DC;stroke-width:1;fill:none} .rl{stroke:#14202C;stroke-width:1.5;fill:none}
  .no{fill:#FFFFFF;stroke:#0E8F7E;stroke-width:2.4} .nh{fill:#0E8F7E;stroke:#0E8F7E;stroke-width:2.4}
  .nf{fill:#FFFFFF;stroke:#C0392B;stroke-width:2.8} .nd{fill:#E4EAF0;stroke:#9AA9B6;stroke-width:2}
  .noff{fill:#FFFFFF;stroke:#9AA9B6;stroke-width:2}
  .lo{stroke:#0E8F7E;stroke-width:2;fill:none} .loff{stroke:#9AA9B6;stroke-width:1.6;fill:none}
  .lf{stroke:#C0392B;stroke-width:2.4;fill:none;stroke-dasharray:5 3}
  .ld{stroke:#9AA9B6;stroke-width:1.6;fill:none;stroke-dasharray:4 3}
</style>
  <rect x="0" y="0" width="760" height="450" fill="#FFFFFF"/>
  <text class="l" x="190" y="34" text-anchor="end">Recepción</text>
  <rect class="tr" x="200" y="20" width="333.3333333333333" height="18" rx="3"/>
  <rect class="a" x="200" y="20" width="83.33333333333333" height="18" rx="3"/>
  <line x1="450" y1="17" x2="450" y2="41" stroke="#14202C" stroke-width="2"/>
  <text class="s" x="545" y="34" text-anchor="start">4 / 12 / 16</text>
  <text class="l" x="190" y="72" text-anchor="end">Recursos Humanos</text>
  <rect class="tr" x="200" y="58" width="333.3333333333333" height="18" rx="3"/>
  <rect class="a" x="200" y="58" width="166.66666666666666" height="18" rx="3"/>
  <line x1="450" y1="55" x2="450" y2="79" stroke="#14202C" stroke-width="2"/>
  <text class="s" x="545" y="72" text-anchor="start">8 / 12 / 16</text>
  <text class="l" x="190" y="110" text-anchor="end">Legal</text>
  <rect class="tr" x="200" y="96" width="333.3333333333333" height="18" rx="3"/>
  <rect class="a" x="200" y="96" width="83.33333333333333" height="18" rx="3"/>
  <line x1="450" y1="93" x2="450" y2="117" stroke="#14202C" stroke-width="2"/>
  <text class="s" x="545" y="110" text-anchor="start">4 / 12 / 16</text>
  <text class="l" x="190" y="148" text-anchor="end">Capacitación</text>

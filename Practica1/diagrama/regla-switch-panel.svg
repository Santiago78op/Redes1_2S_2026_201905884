  <line x1="450" y1="131" x2="450" y2="155" stroke="#14202C" stroke-width="2"/>
  <text class="s" x="545" y="148" text-anchor="start">10 / 12 / 16</text>
  <text class="l" x="190" y="186" text-anchor="end">Diseño e Innovación</text>
  <rect class="tr" x="200" y="172" width="333.3333333333333" height="18" rx="3"/>
  <rect class="a" x="200" y="172" width="166.66666666666666" height="18" rx="3"/>
  <line x1="450" y1="169" x2="450" y2="193" stroke="#14202C" stroke-width="2"/>

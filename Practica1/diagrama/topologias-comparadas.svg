<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" width="960" height="300">
  <title>Las cuatro topologias evaluadas - QuetzalDev</title>
  <desc>Estrella (adoptada, 5 enlaces radiales), bus (medio compartido), anillo (5 enlaces en lazo) y malla completa (10 enlaces). Dibujadas con cinco nodos.</desc>
  <style>
  text{font-family:Consolas,"Courier New",monospace;fill:#14202C}
  .h{font-size:15px;font-weight:700;letter-spacing:.02em}
  .l{font-size:13px;fill:#4A5C6E} .s{font-size:11px;fill:#8497A8}
  .v{font-size:14px;font-weight:700} .c{font-size:11px;fill:#8497A8;letter-spacing:.12em}
  .a{fill:#0E8F7E} .b{fill:#1668B8} .o{fill:#9AA9B6} .f{fill:#C0392B}
  .ta{fill:#0E8F7E} .tb{fill:#1668B8} .to{fill:#9AA9B6} .tf{fill:#C0392B;font-weight:700}
  .tr{fill:#E4EAF0} .ax{stroke:#8497A8;stroke-width:1;fill:none}
  .gl{stroke:#C7D2DC;stroke-width:1;fill:none} .rl{stroke:#14202C;stroke-width:1.5;fill:none}
  .no{fill:#FFFFFF;stroke:#0E8F7E;stroke-width:2.4} .nh{fill:#0E8F7E;stroke:#0E8F7E;stroke-width:2.4}
  .nf{fill:#FFFFFF;stroke:#C0392B;stroke-width:2.8} .nd{fill:#E4EAF0;stroke:#9AA9B6;stroke-width:2}
  .noff{fill:#FFFFFF;stroke:#9AA9B6;stroke-width:2}
  .lo{stroke:#0E8F7E;stroke-width:2;fill:none} .loff{stroke:#9AA9B6;stroke-width:1.6;fill:none}
  .lf{stroke:#C0392B;stroke-width:2.4;fill:none;stroke-dasharray:5 3}
  .ld{stroke:#9AA9B6;stroke-width:1.6;fill:none;stroke-dasharray:4 3}
</style>
  <rect x="0" y="0" width="960" height="300" fill="#FFFFFF"/>
  <g class="lo">
    <line x1="130" y1="112" x2="130.0" y2="50.0"/>
    <line x1="130" y1="112" x2="71.0" y2="92.8"/>
    <line x1="130" y1="112" x2="93.6" y2="162.2"/>
    <line x1="130" y1="112" x2="166.4" y2="162.2"/>
    <line x1="130" y1="112" x2="189.0" y2="92.8"/>
  </g>
  <circle class="nh" cx="130" cy="112" r="13"/>
  <circle class="no" cx="130.0" cy="50.0" r="8"/>
  <circle class="no" cx="71.0" cy="92.8" r="8"/>
  <circle class="no" cx="93.6" cy="162.2" r="8"/>
  <circle class="no" cx="166.4" cy="162.2" r="8"/>
  <circle class="no" cx="189.0" cy="92.8" r="8"/>
  <text class="h" x="130" y="24" text-anchor="middle">ESTRELLA</text>
  <text class="v ta" x="130" y="206" text-anchor="middle">ADOPTADA</text>
  <text class="s" x="130" y="224" text-anchor="middle">5 enlaces · 1 concentrador</text>
  <text class="s" x="130" y="240" text-anchor="middle">un corte afecta a 1 nodo</text>
  <g class="loff">
    <line x1="285" y1="112" x2="425" y2="112" stroke-width="3"/><line x1="285" y1="103" x2="285" y2="121" stroke-width="3"/><line x1="425" y1="103" x2="425" y2="121" stroke-width="3"/>
    <line x1="295" y1="112" x2="295" y2="70"/>
    <line x1="325" y1="112" x2="325" y2="154"/>
    <line x1="355" y1="112" x2="355" y2="70"/>
    <line x1="385" y1="112" x2="385" y2="154"/>
    <line x1="415" y1="112" x2="415" y2="70"/>
  </g>
  <circle class="noff" cx="295" cy="70" r="8"/>
  <circle class="noff" cx="325" cy="154" r="8"/>
  <circle class="noff" cx="355" cy="70" r="8"/>
  <circle class="noff" cx="385" cy="154" r="8"/>
  <circle class="noff" cx="415" cy="70" r="8"/>
  <text class="h to" x="355" y="24" text-anchor="middle">BUS</text>
  <text class="s" x="355" y="206" text-anchor="middle">DESCARTADA</text>
  <text class="s" x="355" y="224" text-anchor="middle">1 medio compartido</text>
  <text class="s" x="355" y="240" text-anchor="middle">un corte afecta a los 5</text>
  <g class="loff">
    <line x1="580.0" y1="54.0" x2="524.8" y2="94.1"/>
    <line x1="524.8" y1="94.1" x2="545.9" y2="158.9"/>
    <line x1="545.9" y1="158.9" x2="614.1" y2="158.9"/>
    <line x1="614.1" y1="158.9" x2="635.2" y2="94.1"/>
    <line x1="635.2" y1="94.1" x2="580.0" y2="54.0"/>
  </g>
  <circle class="noff" cx="580.0" cy="54.0" r="8"/>
  <circle class="noff" cx="524.8" cy="94.1" r="8"/>
  <circle class="noff" cx="545.9" cy="158.9" r="8"/>
  <circle class="noff" cx="614.1" cy="158.9" r="8"/>
  <circle class="noff" cx="635.2" cy="94.1" r="8"/>
  <text class="h to" x="580" y="24" text-anchor="middle">ANILLO</text>
  <text class="s" x="580" y="206" text-anchor="middle">DESCARTADA</text>
  <text class="s" x="580" y="224" text-anchor="middle">5 enlaces en lazo</text>
  <text class="s" x="580" y="240" text-anchor="middle">un corte parte el anillo</text>
  <g class="loff">
    <line x1="805.0" y1="54.0" x2="749.8" y2="94.1"/>
    <line x1="805.0" y1="54.0" x2="770.9" y2="158.9"/>
    <line x1="805.0" y1="54.0" x2="839.1" y2="158.9"/>
    <line x1="805.0" y1="54.0" x2="860.2" y2="94.1"/>
    <line x1="749.8" y1="94.1" x2="770.9" y2="158.9"/>
    <line x1="749.8" y1="94.1" x2="839.1" y2="158.9"/>
    <line x1="749.8" y1="94.1" x2="860.2" y2="94.1"/>
    <line x1="770.9" y1="158.9" x2="839.1" y2="158.9"/>
    <line x1="770.9" y1="158.9" x2="860.2" y2="94.1"/>
    <line x1="839.1" y1="158.9" x2="860.2" y2="94.1"/>
  </g>
  <circle class="noff" cx="805.0" cy="54.0" r="8"/>
  <circle class="noff" cx="749.8" cy="94.1" r="8"/>
  <circle class="noff" cx="770.9" cy="158.9" r="8"/>
  <circle class="noff" cx="839.1" cy="158.9" r="8"/>
  <circle class="noff" cx="860.2" cy="94.1" r="8"/>
  <text class="h to" x="805" y="24" text-anchor="middle">MALLA COMPLETA</text>
  <text class="s" x="805" y="206" text-anchor="middle">DESCARTADA</text>
  <text class="s" x="805" y="224" text-anchor="middle">10 enlaces · n(n−1)/2</text>
  <text class="s" x="805" y="240" text-anchor="middle">tolera cortes, pero no se paga</text>
  <g class="gl"><line x1="242" y1="14" x2="242" y2="248"/><line x1="467" y1="14" x2="467" y2="248"/><line x1="692" y1="14" x2="692" y2="248"/></g>
  <text class="s" x="20" y="272" text-anchor="start">Con cinco nodos, estrella y anillo cuestan lo mismo en enlaces. La diferencia es qué ocurre al cortar uno:</text>
  <text class="s" x="20" y="288" text-anchor="start">en estrella cae un nodo; en anillo, el segmento completo.</text>
</svg>

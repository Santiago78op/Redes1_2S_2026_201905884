<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" font-family="Segoe Print, Bradley Hand, Comic Sans MS, Comic Neue, cursive">
  <title>Figura 8 — VTP con un servidor por zona</title>
  <desc>Los cinco switches principales son servidores VTP del dominio 201905884 y cada uno crea la VLAN de su zona; los cinco switches de acceso son clientes y reciben las siete VLANs.</desc>
  <style>
    .t   { font-size: 20px; fill: #212529; }
    .h   { font-size: 15px; font-weight: bold; fill: #212529; }
    .sub { font-size: 12.5px; fill: #868e96; }
    .lbl { font-size: 12px; fill: #495057; }
    .swt { font-size: 12.5px; font-weight: bold; fill: #212529; }
    .red { font-size: 12.5px; font-weight: bold; fill: #c92a2a; }
    .grn { font-size: 12.5px; font-weight: bold; fill: #2f9e44; }
  </style>
  <rect width="960" height="600" fill="#ffffff"/>
  <text x="480" y="32" class="t" text-anchor="middle">Cinco servidores, una sola base de VLANs</text>
  <text x="480" y="54" class="sub" text-anchor="middle">Dominio 201905884 · versión 2 · cada servidor aporta la VLAN de su zona y todos terminan con las siete</text>

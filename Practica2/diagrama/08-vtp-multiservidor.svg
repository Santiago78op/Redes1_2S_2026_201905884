  <text x="480" y="559" class="red" text-anchor="middle">Riesgo medido: dos servidores que cambian la base al mismo tiempo se pisan.</text>
  <text x="480" y="577" class="sub" text-anchor="middle">Gana el anuncio con la revisión más alta. Las VLANs se crearon un servidor a la vez.</text>

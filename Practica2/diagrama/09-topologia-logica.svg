<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" width="960" height="640" font-family="Segoe Print, Bradley Hand, Comic Sans MS, Comic Neue, cursive">
  <title>Figura 9 — Topología lógica de la red de Cayalá</title>
  <desc>Diez switches en cinco zonas. El núcleo es una malla entre Distrito Empresarial, Paseo Cayalá y Distrito Moda, con dos EtherChannel LACP hacia el switch que enruta.</desc>

  <text x="310" y="206" class="lbl" text-anchor="middle" fill="#1971c2" font-weight="bold">100 M</text>
  <text x="171" y="296" class="lbl" text-anchor="middle" fill="#1971c2" font-weight="bold">100 M</text>
  <text x="650" y="206" class="lbl" text-anchor="middle" fill="#1971c2" font-weight="bold">100 M · único enlace</text>
  <line x1="60" y1="606" x2="100" y2="606" stroke="#1971c2" stroke-width="2.4"/><text x="108" y="610" class="lbl">cobre UTP, cable cruzado</text>
  <line x1="300" y1="603" x2="340" y2="603" stroke="#1971c2" stroke-width="2.4"/><line x1="300" y1="609" x2="340" y2="609" stroke="#1971c2" stroke-width="2.4"/><text x="348" y="610" class="lbl">EtherChannel (dos enlaces físicos)</text>

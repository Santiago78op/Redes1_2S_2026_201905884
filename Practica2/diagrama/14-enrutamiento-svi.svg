<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" width="960" height="430" font-family="Segoe Print, Bradley Hand, Comic Sans MS, Comic Neue, cursive">
  <title>Figura 14 — Enrutamiento entre zonas por SVI</title>
  <desc>Un ping de la zona 1 a la zona 5 sube por la VLAN 14 hasta el SVI de SW-EMPRESARIAL, se enruta entre dos redes directamente conectadas y baja por la VLAN 54.</desc>
  <style>
    .t   { font-size: 20px; fill: #212529; }
    .h   { font-size: 15px; font-weight: bold; fill: #212529; }
    .sub { font-size: 12.5px; fill: #868e96; }
    .lbl { font-size: 12px; fill: #495057; }
    .swt { font-size: 12.5px; font-weight: bold; fill: #212529; }
    .red { font-size: 12.5px; font-weight: bold; fill: #c92a2a; }
    .grn { font-size: 12.5px; font-weight: bold; fill: #2f9e44; }
  </style>
  <rect width="960" height="430" fill="#ffffff"/>
  <text x="480" y="32" class="t" text-anchor="middle">Las VLANs aíslan en Capa 2; el gateway comunica en Capa 3</text>
  <rect x="300" y="70" width="360" height="250" rx="12" fill="#f8f9fa" stroke="#343a40" stroke-width="2.4"/>
  <text x="480" y="96" class="h" text-anchor="middle">SW-EMPRESARIAL · ip routing</text>
  <rect x="320" y="112" width="320" height="30" rx="6" fill="#e5dbff" stroke="#7048e8" stroke-width="2"/>
  <text x="334" y="132" font-size="13" font-weight="bold" fill="#7048e8">Vlan14</text>
  <text x="626" y="132" class="lbl" text-anchor="end" font-size="12.5">C · 192.168.4.1/26</text>
  <rect x="320" y="152" width="320" height="30" rx="6" fill="#dee2e6" stroke="#343a40" stroke-width="2"/>
  <text x="334" y="172" font-size="13" font-weight="bold" fill="#343a40">Vlan44</text>
  <text x="626" y="172" class="lbl" text-anchor="end" font-size="12.5">C · 192.168.4.65/26</text>
  <rect x="320" y="192" width="320" height="30" rx="6" fill="#c5f6fa" stroke="#0c8599" stroke-width="2"/>
  <text x="334" y="212" font-size="13" font-weight="bold" fill="#0c8599">Vlan24</text>
  <text x="626" y="212" class="lbl" text-anchor="end" font-size="12.5">C · 192.168.4.129/27</text>
  <rect x="320" y="232" width="320" height="30" rx="6" fill="#ffe8cc" stroke="#f08c00" stroke-width="2"/>
  <text x="334" y="252" font-size="13" font-weight="bold" fill="#f08c00">Vlan34</text>
  <text x="626" y="252" class="lbl" text-anchor="end" font-size="12.5">C · 192.168.4.161/28</text>
  <rect x="320" y="272" width="320" height="30" rx="6" fill="#ffdeeb" stroke="#d6336c" stroke-width="2"/>
  <text x="334" y="292" font-size="13" font-weight="bold" fill="#d6336c">Vlan54</text>
  <text x="626" y="292" class="lbl" text-anchor="end" font-size="12.5">C · 192.168.4.177/28</text>
  <rect x="40" y="108" width="170" height="52" rx="8" fill="#e5dbff" stroke="#7048e8" stroke-width="2.2"/>
  <text x="125" y="130" class="swt" text-anchor="middle">PC-PASEO-1</text><text x="125" y="148" class="lbl" text-anchor="middle">192.168.4.2 · gw .1</text>
  <rect x="750" y="268" width="170" height="52" rx="8" fill="#ffdeeb" stroke="#d6336c" stroke-width="2.2"/>
  <text x="835" y="290" class="swt" text-anchor="middle">PC-ENCINOS-2</text><text x="835" y="308" class="lbl" text-anchor="middle">192.168.4.179 · gw .177</text>
  <defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#212529"/></marker></defs>
  <path d="M210,130 H318" stroke="#7048e8" stroke-width="3" fill="none" marker-end="url(#a)"/>
  <path d="M642,287 H748" stroke="#d6336c" stroke-width="3" fill="none" marker-end="url(#a)"/>
  <path d="M306,127 C270,127 270,287 318,287" stroke="#212529" stroke-width="2.2" stroke-dasharray="6 5" fill="none" marker-end="url(#a)"/>
  <text x="125" y="98" class="lbl" text-anchor="middle" fill="#7048e8" font-weight="bold">1 · trama en la VLAN 14</text>
  <text x="196" y="214" class="lbl" text-anchor="middle" font-weight="bold">2 · se enruta</text>
  <text x="196" y="230" class="lbl" text-anchor="middle">de Vlan14 a Vlan54</text>
  <text x="835" y="258" class="lbl" text-anchor="middle" fill="#d6336c" font-weight="bold">3 · trama en la VLAN 54</text>
  <text x="480" y="356" class="sub" text-anchor="middle" font-size="13.5">C = red directamente conectada. No hay rutas estáticas: todas las zonas llegan al mismo switch.</text>
  <text x="480" y="380" class="sub" text-anchor="middle" font-size="13.5">Un broadcast de la zona 1 nunca llega a la zona 5: se queda en el SVI de su VLAN.</text>
  <text x="480" y="410" class="lbl" text-anchor="middle">Medido: PC-PASEO-1 → PC-ENCINOS-2, 3/4 en el primer intento: el paquete perdido es la resolución ARP.</text>
</svg>

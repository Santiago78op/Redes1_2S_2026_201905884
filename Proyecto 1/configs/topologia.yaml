     inalambricos: [LAP-VIS-1, LAP-VIS-2, LAP-VIS-3]}
  - {switch: SW-COMUNES, puertos: [Fa0/2], vlan: 54, tipo: "PC-PT",
     nombres: [PC-VIS-1]}
  - {switch: SW-PLANTA, puertos: [Gi4/1], vlan: 34, tipo: "Hub-PT",
     nombres: [HUB-LEGACY],
     colgados: [PC-MAQ-1, PC-MAQ-2, PC-MAQ-3, PC-MAQ-4],
     nota: "UN solo puerto access. Repartir el hub en varios puertos crearia un bucle."}

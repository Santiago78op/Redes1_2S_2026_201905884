     nombres: [PC-SUP-1, PC-SUP-2],
     nota: "supervision, fuera del hub, para no compartir el medio degradado"}

puertos_no_utilizados:
  accion: "switchport access vlan 999 + shutdown"
  alcance: "todos los puertos libres de los switches de acceso"
  requisito_enunciado: false   # buena practica anadida, no exigida

# ---------------------------------------------------------------------------
# RESULTADO ESPERADO — para contrastar, no para asumir
# ---------------------------------------------------------------------------
esperado:
  dominios_colision: {total: 54, cableados: 53, inalambricos: 1, compartidos: ["HUB-LEGACY (6 miembros)", "AP-VISITANTES (3 laptops)"]}
  dominios_broadcast: {con_usuarios: 5, vacios: ["94 nativa", "999 sin-uso"]}
  stp_bloqueados:
    - {switch: SW-ALA-B, interfaz: "Gi0/2", vlan: 14, rol: "Altn", estado: "BLK"}
    - {switch: SW-ID-3,  interfaz: "Fa0/24", vlan: 24, rol: "Altn", estado: "BLK"}
    - {switch: SW-ID-2,  interfaz: "Gi0/2",  vlan: 24, rol: "Altn", estado: "BLK"}
  convergencia_stp_s: "30-50"
  convergencia_etherchannel: "inmediata (no hay reconvergencia de STP)"

# Riesgos de diseño, verificados en el simulador.
riesgos_verificados:
  - id: R1
    estado: RESUELTO_OK
    descripcion: "¿Acepta el chasis modular 'channel-group N mode active' sobre modulos de FIBRA?"
    resultado: "SI. Probado en banco antes de cablear: dos Switch-PT-Empty con PT-SWITCH-NM-1FGE,
                dos enlaces de fibra, 'channel-group 2 mode active' en ambos extremos -> la interfaz
                Port-channel2 aparece en los dos switches."
    consecuencia: "El canal se configura, pero el enlace de fibra no levanta (S8). Po2 se formó sobre
                   cobre: Po2(SU) con Gig2/1(P) y Gig3/1(P) en SW-CORE (evidencia E5)."
  - id: R2
    estado: RESUELTO_CAMBIA_EL_DOC
    descripcion: "La numeracion slot/puerto de los 4 chasis modulares era PREVISTA."
    resultado: "Los slots se numeran DESDE 0 y cada uno da el puerto <Tipo>N/1. Lo previsto era
                1-indexed (Gi1/1, Gi2/1...); lo real es 0-indexed (Gi0/1, Gi1/1...)."
    consecuencia: "Corregidos este archivo ('slots_modulares'), README §14 y §23 y los 11 scripts."
  - id: R3
    estado: RESUELTO_OK
    descripcion: "¿Acepta el chasis modular 'switchport nonegotiate'?"
    resultado: "SI. Figura en el running-config de los 11 switches, incluidos los 4 chasis."

# Restricciones de Packet Tracer que condicionan el modelo de los chasis.
restricciones_del_simulador:
  - id: S1
    descripcion: "En Packet Tracer el 2960-24TT y el 3560-24PS NO son modulares: rechazan todo
                  modulo SFP (probado con GLC-LH-SMD, GLC-GE-100FX y PT-SWITCH-NM-1FGE)."
    consecuencia: "Un switch de IOS real NO puede terminar un enlace de fibra. La fibra obliga al
                   chasis genérico, y eso valida usar chasis modulares en los 4 switches con fibra."
  - id: S2
    descripcion: "'Switch-PT' llega con los 6 slots YA ocupados por modulos de cobre."
    consecuencia: "Hay que usar 'Switch-PT-Empty'. Con Switch-PT, addModule devuelve false siempre."
  - id: S3
    descripcion: "Los modulos solo entran con el chasis APAGADO."
    consecuencia: "setPower(false) -> addModule -> setPower(true) + skipBoot. Encendido, addModule
                   devuelve false EN SILENCIO, sin lanzar error."
  - id: S4
    descripcion: "El chasis tiene 6 slots y cada slot da UN puerto: maximo 6 puertos."
    consecuencia: "SW-CORE usa los 6 justos (2 de Po1 + 2 de Po2 + 2 trunks). No queda ninguno libre."
  - id: S6
    descripcion: "El modulo de cobre FastEthernet del chasis generico (PT-SWITCH-NM-1CFE) NO enlaza
                  con un Hub-PT: el puerto queda down en ambos extremos. El modulo de cobre GIGABIT
                  (PT-SWITCH-NM-1CGE) SI enlaza con el hub."
    evidencia: "Control: el mismo hub contra un 2960 real levanta (up=true); contra el puerto 1CFE
                del chasis, no. Al recablearlo al puerto 1CGE del mismo chasis, levanta."
    consecuencia: "El HUB-LEGACY cuelga de SW-PLANTA Gi4/1 (modulo 1CGE en el slot 4), NO de Fa1/1.
                   Ahi van port-security maximum 5 restrict y storm-control broadcast level 20.
                   Fa1/1 queda libre: VLAN 999 + shutdown (README §14 y §23)."
  - id: S7
    descripcion: "El Hub-PT tiene 6 puertos REALES: FastEthernet0..FastEthernet5. El catalogo los
                  lista como 'Port 0'..'Port 7', pero eso es solo un alias de display y son 6."
    consecuencia: "Con 4 maquinas + 1 switch se usan 5 de 6. No caben mas de 5 equipos colgados."
  - id: S5
    descripcion: "El chasis modular SI soporta el IOS que el proyecto necesita (leido de su
                  startup-config real): pvst, root primary, priority, channel-group mode active,
                  trunk native vlan, allowed vlan, port-security violation restrict, storm-control
                  y banner motd."
    consecuencia: "Era la duda que podia tumbar el diseno entero. No lo hace."
  - id: S8
    descripcion: "Ningun enlace de fibra levanta en esta instalacion de Packet Tracer: probado con
                  PT-SWITCH-NM-1FGE, PT-SWITCH-NM-1FFE, cable fiber y auto, y entre routers, contra
                  un control de cobre creado en el mismo instante, que si levanta."
    consecuencia: "Los 4 enlaces de fibra del diseno (Po2 x2, Corporativo, Planta) van en cobre en el
                   .pkt, con sus rotulos de medio y distancia de diseno. README §20.1."
  - id: S9
    descripcion: "removeModule sobre un switch encendido crashea Packet Tracer 15-30 s despues
                  (SIGSEGV en Stp::CStpProcess::forwardingDelayCallback)."
    consecuencia: "Apagar el equipo antes de quitarle modulos."

# Especificación de topología — Proyecto 1 "SmartCity Tech Park"
# Especificación de Proyecto1_201905884.pkt. Deriva de README.md §11.1, §13, §14, §18, §19 y §20.
#
# Contrastada contra el simulador. Las interfaces de los chasis modulares son las que Packet Tracer
# crea: un módulo en el slot N produce el puerto <Tipo>N/1, con los slots numerados desde 0.
#
# Modelo de los 4 chasis modulares: Switch-PT-Empty (NO Switch-PT: ese llega con los 6 slots ya
# ocupados por cobre y rechaza cualquier módulo). Tiene 6 slots = 6 puertos como máximo, y los
# módulos sólo entran con el chasis APAGADO.
# Módulos usados en el .pkt: PT-SWITCH-NM-1CGE (cobre Gig) · PT-SWITCH-NM-1CFE (cobre Fast).
# El diseño prevé PT-SWITCH-NM-1FGE (fibra Gig) en los enlaces de fibra; ver S8.

meta:
  carne: "201905884"
  archivo_pkt: "Proyecto1_201905884.pkt"
  packet_tracer_min: "8.0"
  vlan_nativa: 94
  stp_mode: "pvst"              # carné par
  etherchannel_protocol: "lacp" # carné par
  banner_motd: "Acceso Restringido - TechPark_201905884"
  vtp:
    dominio: "Smart_8"
    password: "proyecto12S2026"
    version: 2

vlans:
  - {id: 14,  nombre: "GERENCIA",      area: "Edificio Corporativo",   color: "#7048e8"}
  - {id: 24,  nombre: "INVESTIGACION", area: "Centro de I+D",          color: "#0c8599"}
  - {id: 34,  nombre: "PRODUCCION",    area: "Planta de Produccion",   color: "#f08c00"}
  - {id: 44,  nombre: "SERVIDORES",    area: "Centro de Datos",        color: "#343a40"}
  - {id: 54,  nombre: "VISITANTES",    area: "Areas Comunes",          color: "#d6336c"}
  - {id: 94,  nombre: "NATIVA",        area: "todos los trunks",       color: "#adb5bd", sin_puertos_access: true}
  - {id: 999, nombre: "SIN-USO",       area: "puertos apagados",       color: "#ced4da", sin_puertos_access: true}

switches:
  - hostname: SW-CORE
    modelo_pt: "Switch-PT-Empty (modular)"
    area: "Centro de Datos"
    rol: "core"
    vtp_mode: server
    banner: true
    stp: {primary: [34, 44], secondary: [14, 24, 54]}

  - hostname: SW-SRV
    modelo_pt: "2960-24TT"
    area: "Centro de Datos"
    rol: "acceso"
    vtp_mode: client
    banner: false

  - hostname: SW-DIST-ID
    modelo_pt: "Switch-PT-Empty (modular)"
    area: "Centro de I+D"
    rol: "distribucion"
    vtp_mode: client
    banner: true
    stp: {primary: [24]}

  - hostname: SW-ID-1
    modelo_pt: "2960-24TT"
    area: "Centro de I+D"
    rol: "acceso"
    vtp_mode: client
    banner: false
    stp: {priority: {24: 28672}}   # hace determinista el bloqueo del anillo

  - hostname: SW-ID-2
    modelo_pt: "2960-24TT"
    area: "Centro de I+D"
    rol: "acceso"
    vtp_mode: client
    banner: false

  - hostname: SW-ID-3
    modelo_pt: "2960-24TT"
    area: "Centro de I+D"
    rol: "acceso"
    vtp_mode: client
    banner: false

  - hostname: SW-DIST-CORP
    modelo_pt: "Switch-PT-Empty (modular)"
    area: "Edificio Corporativo"
    rol: "distribucion"
    vtp_mode: client
    banner: true
    stp: {primary: [14, 54]}

  - hostname: SW-ALA-A
    modelo_pt: "2960-24TT"
    area: "Edificio Corporativo"
    rol: "acceso"
    vtp_mode: client
    banner: false
    stp: {priority: {14: 28672}}   # desempata el enlace Ala A <-> Ala B

  - hostname: SW-ALA-B
    modelo_pt: "2960-24TT"
    area: "Edificio Corporativo"
    rol: "acceso"
    vtp_mode: client
    banner: false

  - hostname: SW-COMUNES
    modelo_pt: "2960-24TT"
    area: "Edificio Corporativo (Areas Comunes)"
    rol: "acceso"
    vtp_mode: transparent          # aislamiento de administracion de VLANs
    banner: false
    vlans_locales: [54, 94, 999]   # en Transparent se crean a mano

  - hostname: SW-PLANTA
    modelo_pt: "Switch-PT-Empty (modular)"
    area: "Planta de Produccion"
    rol: "acceso"
    vtp_mode: client
    banner: false

# ---------------------------------------------------------------------------
# ENLACES ENTRE SWITCHES — 15 fisicos, 13 troncales logicos
# medio: utp-cat6 | fibra-om3 | fibra-om4      velocidad: 1G | 100M
# ---------------------------------------------------------------------------
# medio: el del DISEÑO. cable_pt: el cable real del .pkt. Los enlaces de fibra van en cobre ("cross")
# porque en Packet Tracer ningún enlace de fibra levanta (restricción S8, README §20.1).
enlaces_switch:
  - {a: [SW-CORE, Gi0/1],  b: [SW-SRV, Gi0/1],       medio: utp-cat6,  cable_pt: cross, velocidad: 1G,   distancia_m: 10,  canal: Po1, allowed: [1,44,94], hecho: true}
  - {a: [SW-CORE, Gi1/1],  b: [SW-SRV, Gi0/2],       medio: utp-cat6,  cable_pt: cross, velocidad: 1G,   distancia_m: 10,  canal: Po1, allowed: [1,44,94], hecho: true}
  - {a: [SW-CORE, Gi2/1],  b: [SW-DIST-ID, Gi0/1],   medio: fibra-om4, cable_pt: cross, velocidad: 1G,   distancia_m: 180, canal: Po2, allowed: [1,24,94], hecho: true}
  - {a: [SW-CORE, Gi3/1],  b: [SW-DIST-ID, Gi1/1],   medio: fibra-om4, cable_pt: cross, velocidad: 1G,   distancia_m: 180, canal: Po2, allowed: [1,24,94], hecho: true}
  - {a: [SW-CORE, Gi4/1],  b: [SW-DIST-CORP, Gi0/1], medio: fibra-om3, cable_pt: cross, velocidad: 1G,   distancia_m: 120, allowed: [1,14,54,94], hecho: true}
  - {a: [SW-CORE, Gi5/1],  b: [SW-PLANTA, Gi0/1],    medio: fibra-om3, cable_pt: cross, velocidad: 1G,   distancia_m: 90,  allowed: [1,34,94], hecho: true,
     nota: "fibra por EMI industrial, NO por distancia — es la justificacion clave de §20"}

  - {a: [SW-DIST-ID, Gi2/1], b: [SW-ID-1, Gi0/1],    medio: utp-cat6,  cable_pt: cross, velocidad: 1G,   allowed: [1,24,94], hecho: true}
  - {a: [SW-DIST-ID, Gi3/1], b: [SW-ID-3, Gi0/1],    medio: utp-cat6,  cable_pt: cross, velocidad: 1G,   allowed: [1,24,94], hecho: true}
  - {a: [SW-ID-1, Gi0/2],    b: [SW-ID-2, Gi0/1],    medio: utp-cat6,  cable_pt: cross, velocidad: 1G,   allowed: [1,24,94], hecho: true}
  - {a: [SW-ID-2, Gi0/2],    b: [SW-ID-3, Gi0/2],    medio: utp-cat6,  cable_pt: cross, velocidad: 1G,   allowed: [1,24,94], hecho: true}
  - {a: [SW-ID-1, Fa0/24],   b: [SW-ID-3, Fa0/24],   medio: utp-cat6,  cable_pt: cross, velocidad: 100M, allowed: [1,24,94], hecho: true,
     nota: "cierre del anillo — costo STP 19 frente a 4: es el candidato al bloqueo"}

  - {a: [SW-DIST-CORP, Gi1/1], b: [SW-ALA-A, Gi0/1],   medio: utp-cat6, cable_pt: cross, velocidad: 1G, allowed: [1,14,94], hecho: true}
  - {a: [SW-DIST-CORP, Gi2/1], b: [SW-ALA-B, Gi0/1],   medio: utp-cat6, cable_pt: cross, velocidad: 1G, allowed: [1,14,94], hecho: true}
  - {a: [SW-DIST-CORP, Gi3/1], b: [SW-COMUNES, Gi0/1], medio: utp-cat6, cable_pt: cross, velocidad: 1G, allowed: [1,54,94], hecho: true,
     nota: "SOLO la VLAN 54: aislamiento de visitantes"}
  - {a: [SW-ALA-A, Gi0/2],     b: [SW-ALA-B, Gi0/2],   medio: utp-cat6, cable_pt: cross, velocidad: 1G, distancia_m: 60, allowed: [1,14,94], hecho: true,
     nota: "enlace de respaldo — se espera BLOQUEADO por STP en el extremo SW-ALA-B"}

# Reparto de slots REAL de los 4 chasis modulares (verificado en el simulador).
# Cada slot da exactamente un puerto, y el nombre del puerto es <Tipo><slot>/1.
slots_modulares:
  SW-CORE:        # los 6 slots usados: es el limite del chasis
    0: {modulo: PT-SWITCH-NM-1CGE, puerto: Gi0/1, medio: cobre, destino: "SW-SRV Gi0/1  (Po1)"}
    1: {modulo: PT-SWITCH-NM-1CGE, puerto: Gi1/1, medio: cobre, destino: "SW-SRV Gi0/2  (Po1)"}
    2: {modulo: PT-SWITCH-NM-1CGE, puerto: Gi2/1, medio: cobre, destino: "SW-DIST-ID Gi0/1 (Po2) — diseño: fibra"}
    3: {modulo: PT-SWITCH-NM-1CGE, puerto: Gi3/1, medio: cobre, destino: "SW-DIST-ID Gi1/1 (Po2) — diseño: fibra"}
    4: {modulo: PT-SWITCH-NM-1CGE, puerto: Gi4/1, medio: cobre, destino: "SW-DIST-CORP Gi0/1 — diseño: fibra"}
    5: {modulo: PT-SWITCH-NM-1CGE, puerto: Gi5/1, medio: cobre, destino: "SW-PLANTA Gi0/1 — diseño: fibra"}
  SW-DIST-ID:
    0: {modulo: PT-SWITCH-NM-1CGE, puerto: Gi0/1, medio: cobre, destino: "SW-CORE Gi2/1 (Po2) — diseño: fibra"}
    1: {modulo: PT-SWITCH-NM-1CGE, puerto: Gi1/1, medio: cobre, destino: "SW-CORE Gi3/1 (Po2) — diseño: fibra"}
    2: {modulo: PT-SWITCH-NM-1CGE, puerto: Gi2/1, medio: cobre, destino: "SW-ID-1 Gi0/1"}
    3: {modulo: PT-SWITCH-NM-1CGE, puerto: Gi3/1, medio: cobre, destino: "SW-ID-3 Gi0/1"}
  SW-DIST-CORP:
    0: {modulo: PT-SWITCH-NM-1CGE, puerto: Gi0/1, medio: cobre, destino: "SW-CORE Gi4/1 — diseño: fibra"}
    1: {modulo: PT-SWITCH-NM-1CGE, puerto: Gi1/1, medio: cobre, destino: "SW-ALA-A Gi0/1"}
    2: {modulo: PT-SWITCH-NM-1CGE, puerto: Gi2/1, medio: cobre, destino: "SW-ALA-B Gi0/1"}
    3: {modulo: PT-SWITCH-NM-1CGE, puerto: Gi3/1, medio: cobre, destino: "SW-COMUNES Gi0/1"}
  SW-PLANTA:
    0: {modulo: PT-SWITCH-NM-1CGE, puerto: Gi0/1, medio: cobre, destino: "SW-CORE Gi5/1 — diseño: fibra OM3 90 m, ver S8"}
    1: {modulo: PT-SWITCH-NM-1CFE, puerto: Fa1/1, medio: cobre, destino: "LIBRE - VLAN 999 + shutdown (no enlaza con el hub, ver S6)"}
    2: {modulo: PT-SWITCH-NM-1CFE, puerto: Fa2/1, medio: cobre, destino: "PC-SUP-1"}
    3: {modulo: PT-SWITCH-NM-1CFE, puerto: Fa3/1, medio: cobre, destino: "PC-SUP-2"}
    4: {modulo: PT-SWITCH-NM-1CGE, puerto: Gi4/1, medio: cobre, destino: "HUB-LEGACY (unico puerto del segmento compartido) + port-security + storm-control"}

etherchannels:
  - {id: Po1, extremos: [SW-CORE, SW-SRV],     miembros: 2, protocolo: "lacp active/active", capacidad: "2 Gbps"}
  - {id: Po2, extremos: [SW-CORE, SW-DIST-ID], miembros: 2, protocolo: "lacp active/active", capacidad: "2 Gbps",
     nota: "trunk de mayor ancho de banda del campus — requisito del enunciado"}

